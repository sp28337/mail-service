<!doctype html>
<html lang="ru">
  <body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #5a3e28;">Новая заявка на образцы</h2>
    <table style="width: 100%; border-collapse: collapse; margin-top: 16px;">
      <tr style="background: #f5f0eb;">
        <td style="padding: 10px 14px; font-weight: bold; width: 40%;">Имя</td>
        <td style="padding: 10px 14px;">{{ name }}</td>
      </tr>
      <tr>
        <td style="padding: 10px 14px; font-weight: bold;">Телефон</td>
        <td style="padding: 10px 14px;">{{ phone }}</td>
      </tr>
      <tr style="background: #f5f0eb;">
        <td style="padding: 10px 14px; font-weight: bold;">Артикулы</td>
        <td style="padding: 10px 14px;">{{ articles }}</td>
      </tr>
      <tr>
        <td style="padding: 10px 14px; font-weight: bold;">Порода дерева</td>
        <td style="padding: 10px 14px;">{{ wood_sort }}</td>
      </tr>
    </table>
    <p style="margin-top: 24px; color: #888; font-size: 12px;">Это автоматическое уведомление.</p>
  </body>
</html>
