[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-service"
version = "0.1.0"
description = "Production-ready asynchronous mail service with FastAPI, Celery and Redis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "celery[redis]>=5.4.0,<6.0.0",
  "redis>=5.0.0,<6.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "email-validator>=2.1.1,<3.0.0",
  "jinja2>=3.1.4,<4.0.0",
  "aiosmtplib>=3.0.0,<4.0.0",
  "python-json-logger>=2.0.7,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.23.7,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "coverage[toml]>=7.5.0,<8.0.0",
  "ruff>=0.5.0,<1.0.0",
  "black>=24.4.0,<25.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --disable-warnings --maxfail=1 --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
