services:
  api:
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL:             ${REDIS_URL}
      CELERY_BROKER_URL:     ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    ports:
      - "127.0.0.1:8732:8732"
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8732/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO
    env_file:
      - .env
    environment:
      REDIS_URL:             ${REDIS_URL}
      CELERY_BROKER_URL:     ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file:
      - .env
    networks:
      - backend
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"   # только localhost — не виден снаружи
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:

networks:
  backend:
    driver: bridge