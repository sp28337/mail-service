services:
  api:
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL:             ${REDIS_URL}
      CELERY_BROKER_URL:     ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    ports:
      - "8732:8732"
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8732/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO
    env_file:
      - .env
    environment:
      REDIS_URL:             ${REDIS_URL}
      CELERY_BROKER_URL:     ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    networks:
      - backend
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpassword}
    ports:
      - "127.0.0.1:6379:6379"   # только localhost — не виден снаружи
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:

networks:
  backend:
    driver: bridge